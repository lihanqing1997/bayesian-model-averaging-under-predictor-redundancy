seed_base: 20260522

synthetic:
  n_train: 80
  n_test: 500
  K: 20
  group_size: 5
  rho: [0.5, 0.8, 0.95]
  scenarios:
    - one_representative
    - multi_representative
    - weak_signal
    - noisy_grouping
  replications_full: 30
  replications_debug: 2

direct_sampler:
  capacities: [1, 2, 3]
  lambda_grid: [0, 0.25, 0.5, 1, 1.5, 2]
  n_iter_full: 10000
  n_iter_debug: 1200
  burn_fraction: 0.3333333
  thin: 1
  n_chains: 4
  max_size: 15
  start_groups: 8

support_mcmc:
  n_iter_full: 10000
  n_iter_debug: 1200
  burn_fraction: 0.3333333
  thin: 1
  n_chains: 4
  max_size: 15
  start_size: 8

retained_validation:
  top_group_counts: [8, 12, 16]
  max_family_size: 15
  lambda_grid: [0, 0.25, 0.5, 1, 1.5, 2]
  capacities: [1, 2, 3]
  split_rules:
    - half_chains
    - reverse_half_chains

prior:
  theta: 0.04
  tau2: 4
  a0: 1
  b0: 1

frontier:
  alpha_min_primary: 0.8
  alpha_min_sensitivity: 0.9
  rmse_tolerance: 0.05
  logscore_tolerance: 0.03
  max_rhat: 1.05
  min_ess: 100
  median_ess: 400
  retained_mcse: 0.01

riboflavin:
  replications_full: 20
  replications_debug: 2
  p0_grid: [300, 500]
  K_grid: [50, 100]
  test_fraction: 0.25

outputs:
  root: sim/output
  direct_full: sim/output/direct_full
  retained_validation: sim/output/retained_validation
  riboflavin: sim/output/riboflavin
  diagnostics: sim/output/diagnostics
  tables: sim/output/tables
  figures: sim/output/figures
  logs: sim/output/logs
